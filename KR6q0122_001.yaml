body:
  text: 夫不體道本沒溺生死處胎卵濕化橫豎飛沈之類於中失人身者如大地之土得人身者如爪上之塵於人身中多生邊夷下賤及處中國或受女身若為男子癃殘百疾設得丈夫十相具足者處恐畏世生五濁時以肉為身以氣為命一報之內如石火風燈逝波殘照瞬息而已於中少天非橫殂者不計其數或有得天年壽極耳順萬中無一脫得知命之歲除童稚無知至三十豪四十富且約其間三十年於中有疾病災禍愁憂苦惱居強半矣所以昔人有言浮生一月之中可開口而笑只四五日矣故知憂長喜促樂少苦多如在萬仞之危峯似處千尋之滄海縱得少樂畢慮漂沈且夫有生勞我處胎有老奪我壯色有病損我形貌有死壞我神靈有榮縱我驕奢有辱敗我意氣有貴使我憍倨有賤挫我行藏有富恣我貪婪有貧乏我依報有樂動我情地有苦痛我精神有讚起我高心有毀滅我聲價乃至寒則逼切我體熱則煩悶我襟渴則乾我喉飢則羸我腹驚則懾我魄懼則喪我魂憂則撓我神惱則敗我志順則長我愛逆則起我憎親則牽我情疏則生我恨害則殞我體愁則結我腸乃至遇境生心隨情動念或美或惡俱不稱懷皆長業輪盡喪道本其或更詭於君悖於父傲其物趨其時獸其心狐其意苟其利徇其名誑其人諂其行附其勢欺其孤淵其殃崇其業扇其火吹其風驟其塵背其覺邪其種睽其真但顧前非慮後口謀去靡思回唯求生焉知滅則念念燒煮步步溝隍矣如今或得剎那在世須蘊仁悲行善修心除非去惡書云作善降之百祥作不善降之百殃是以世間逆順種種因緣空受身心妄苦皆為不知三界唯是一心以前五識眼耳鼻舌身及第八識皆是現量所得無心外法以第六明了意識比量計度而成外境全是想生隨念而至若無想念萬法無形故經云想滅間靜識停無為又云諸法不牢固唯立在於念善解見空者一切無想念若了一心之旨心外自然無法可陳豈有欣戚關懷是非干念佛頌云未達境唯心起種種分別達境唯心已分別即不生既了境唯心便捨外塵相從此息分別悟平等真空故起信論云一切境界唯心妄動心若不起一切境界相滅唯一真心遍一切處是故三界虗偽唯心所作離心即無六塵境界乃至一切分別即分別自心心不見心無相可得先德云心外有法生死輪回心外無法生死永棄經云諸法所生唯心所現論云三界無別法但是一心作既信一心須以禪定冥合如經云若能教三千大千世界衆生令行十善不如一食頃一心靜處入一相法門若能諦了自心以此定慧相應則能不動塵勞便成正覺平生所遇莫越於斯普勸後賢可書紳耳
